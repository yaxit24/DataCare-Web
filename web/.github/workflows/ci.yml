name: CI
on:
  push: { branches: [main] }
  pull_request: {}

env:
  MIGRATE_DATABASE_DSN: postgresql://datacare:datacare@localhost:5432/datacare_test
  MIGRATE_DATABASE_URL: postgresql://datacare:datacare@localhost:5432/datacare_test?schema=public
  DATABASE_DSN: postgresql://app_user:ci-app-password-1234@localhost:5432/datacare_test
  DATABASE_URL: postgresql://app_user:ci-app-password-1234@localhost:5432/datacare_test?schema=public
  APP_DB_PASSWORD: ci-app-password-1234
  JWT_SECRET: ci-only-random-signing-key-with-more-than-thirty-two-characters
  APP_TENANT_ID: ci-default
  DEMO_TENANT: ci-default
  SEED_DEMO: '0'

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacare
          POSTGRES_PASSWORD: datacare
          POSTGRES_DB: datacare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datacare -d datacare_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install exact dependency graph
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install production PDF renderer
        working-directory: web
        run: pnpm --filter @datacare/api exec playwright install --with-deps chromium

      - name: Validate and generate database client
        working-directory: web
        run: |
          pnpm --filter @datacare/db db:validate
          pnpm --filter @datacare/db db:generate

      - name: Deploy migration-owned schema and RLS
        working-directory: web
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: |
          pnpm --filter @datacare/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @datacare/db exec prisma migrate diff \
            --from-url "$MIGRATE_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          psql "$MIGRATE_DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/prisma/rls.sql

      - name: Bootstrap restricted runtime role
        working-directory: web
        run: >-
          psql "$MIGRATE_DATABASE_DSN"
          -v ON_ERROR_STOP=1
          -v app_password="$APP_DB_PASSWORD"
          -f packages/db/setup_roles.sql

      - name: Prove runtime role and tenant isolation
        working-directory: web
        run: psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/test/verify_runtime.sql

      - name: Lint and typecheck
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        env:
          RUN_DB_SECURITY_TESTS: '1'
          RUN_DB_INTEGRITY_TESTS: '1'
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Browser workflow smoke
        working-directory: web
        run: pnpm test:browser

      - name: Smoke production readiness
        working-directory: web
        env:
          NODE_ENV: production
          PORT: '4000'
        run: |
          node apps/api/dist/server.js >/tmp/datacare-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/datacare-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/ready >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 1
          done
          echo 'API readiness timed out' >&2
          exit 1

      - name: Check formatting
        working-directory: web
        run: pnpm format:check

  g5-desktop-comparison:
    name: G5 desktop comparison harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacare
          POSTGRES_PASSWORD: datacare
          POSTGRES_DB: datacare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U datacare -d datacare_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install exact dependency graph
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Validate and generate database client
        working-directory: web
        run: |
          pnpm --filter @datacare/db db:validate
          pnpm --filter @datacare/db db:generate

      - name: Deploy migration-owned schema and RLS
        working-directory: web
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: |
          pnpm --filter @datacare/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @datacare/db exec prisma migrate diff \
            --from-url "$MIGRATE_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          psql "$MIGRATE_DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/prisma/rls.sql

      - name: Bootstrap restricted runtime role
        working-directory: web
        run: >-
          psql "$MIGRATE_DATABASE_DSN"
          -v ON_ERROR_STOP=1
          -v app_password="$APP_DB_PASSWORD"
          -f packages/db/setup_roles.sql

      - name: Build G5 harness dependencies
        working-directory: web
        run: pnpm --filter @datacare/api build

      - name: Run G5 desktop comparison harness
        working-directory: web
        env:
          CUTOVER_SOURCE_HOST: ${{ secrets.DESKTOP_SOURCE_HOST }}
          CUTOVER_SOURCE_PORT: ${{ secrets.DESKTOP_SOURCE_PORT }}
          CUTOVER_SOURCE_USER: ${{ secrets.DESKTOP_SOURCE_USER }}
          CUTOVER_SOURCE_PASSWORD: ${{ secrets.DESKTOP_SOURCE_PASSWORD }}
          CUTOVER_SOURCE_DATABASE: ${{ secrets.DESKTOP_SOURCE_DATABASE }}
          CUTOVER_SOURCE_ENCRYPT: ${{ vars.DESKTOP_SOURCE_ENCRYPT }}
          CUTOVER_SOURCE_TRUST_SERVER_CERTIFICATE: ${{ vars.DESKTOP_SOURCE_TRUST_SERVER_CERTIFICATE }}
          G5_TARGET_TENANT: ci-default
          G5_FORMS: ${{ secrets.DESKTOP_G5_FORMS }}
          G5_TABLES: ${{ vars.DESKTOP_G5_TABLES }}
        run: node apps/api/integration/g5-compare.mjs

      - name: Require G5 report artifact
        working-directory: web
        run: test -s ../project-memory/parity/g5/latest.json

      - name: Upload G5 comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-desktop-comparison
          path: project-memory/parity/g5
          if-no-files-found: error
