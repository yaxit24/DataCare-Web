# Right-sized production stack (ADR-0002: scale-ready, not scaled).
# One small managed host: API + Postgres + Redis. Scale levers (read replica, object store,
# autoscaling) are documented in ADR-0002 and deferred until load warrants.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datacare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: datacare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/perf-indexes.sql:/docker-entrypoint-initdb.d/20-perf-indexes.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datacare -d datacare']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # runtime connects as the NON-superuser app_user so RLS is enforced
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?set in .env}@postgres:5432/datacare
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      APP_VERSION: ${APP_VERSION:-0.0.0}
      APP_TENANT_ID: ${APP_TENANT_ID:?set in .env}
      APP_EDITION: ${APP_EDITION:-S}
      APP_EDITION_BETA: ${APP_EDITION_BETA:-0}
      # e-Invoice / IRN. Passed through UNSET-by-default on purpose: with NODE_ENV=production the API refuses
      # to issue an IRN rather than fabricating one, so an absent value fails loudly at the point of use
      # instead of silently producing an invalid invoice. Previously these were not forwarded at all, so
      # setting them in .env had no effect and e-invoicing always ran fake.
      GSP_ASPID: ${GSP_ASPID:-}
      GSP_PASSWORD: ${GSP_PASSWORD:-}
      GSP_GSTIN: ${GSP_GSTIN:-}
      GSP_USER: ${GSP_USER:-}
      GSP_EINV_PWD: ${GSP_EINV_PWD:-}
      GSP_SANDBOX: ${GSP_SANDBOX:-}
      # Messaging. Unset by default: with no provider the API refuses sends (503) instead of faking them (G33).
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_API_VERSION: ${WA_API_VERSION:-}
      SMS_URL_TEMPLATE: ${SMS_URL_TEMPLATE:-}
      SMS_KEY: ${SMS_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
