name: CI
# Developer CI. Answers "did this change break anything visible", and is built to stay ACTIONABLE.
#
# It is deliberately not a release gate: the desktop comparison below runs under `continue-on-error` because
# the retained capture is known red, and `schema:readiness` / `fresh:provision` exit 0 with a `*_SKIP` result
# when their inputs are absent. Green here means "nothing objected", not "this commit is releasable".
#
# The gate that refuses RED, SKIP, stale, synthetic and missing evidence is a separate workflow:
# `.github/workflows/release-certification.yml`, which runs `pnpm release:certify`. P0-07 requires the two to
# be separate, so do not "fix" this file by removing the tolerance below — that would make ordinary pull
# requests unmergeable while proving nothing extra about a release.
on:
  push: { branches: [main] }
  pull_request: {}

permissions:
  contents: read

env:
  MIGRATE_DATABASE_DSN: postgresql://datacare:datacare@localhost:55433/datacare_test
  MIGRATE_DATABASE_URL: postgresql://datacare:datacare@localhost:55433/datacare_test?schema=public
  DATABASE_DSN: postgresql://app_user:ci-app-password-1234@localhost:55433/datacare_test
  DATABASE_URL: postgresql://app_user:ci-app-password-1234@localhost:55433/datacare_test?schema=public
  APP_DB_PASSWORD: ci-app-password-1234
  JWT_SECRET: ci-only-random-signing-key-with-more-than-thirty-two-characters
  APP_TENANT_ID: ci-default
  DEMO_TENANT: ci-default
  SEED_DEMO: '0'

jobs:
  # Repository gates that need no database. Before this job, CI could be green while the repository's own gates
  # were red (gaps G20, G21). Each gate runs even when an earlier one fails, so one red cannot hide another.
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install, generate the database client and build the API's workspace dependencies
        id: setup
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @datacare/db db:generate
          pnpm --filter "@datacare/api^..." run build

      - name: 'Gate: API and core test sources type-check strictly'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: web
        run: pnpm typecheck:tests

      - name: 'Gate: documentation citations resolve and pinned claims hold'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: web
        run: pnpm docs:refs

      - name: 'Gate: master parity plan is internally consistent'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 docs/master-parity-plan-2026-09-29/validate_plan.py

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacare
          POSTGRES_PASSWORD: datacare
          POSTGRES_DB: datacare_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U datacare -d datacare_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install exact dependency graph
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install production PDF renderer
        working-directory: web
        run: pnpm --filter @datacare/api exec playwright install --with-deps chromium

      - name: Validate and generate database client
        working-directory: web
        run: |
          pnpm --filter @datacare/db db:validate
          pnpm --filter @datacare/db db:generate

      - name: Deploy migration-owned schema and RLS
        working-directory: web
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: |
          pnpm --filter @datacare/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @datacare/db exec prisma migrate diff \
            --from-url "$MIGRATE_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          psql "$MIGRATE_DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/prisma/rls.sql

      - name: Bootstrap restricted runtime role
        working-directory: web
        run: >-
          psql "$MIGRATE_DATABASE_DSN"
          -v ON_ERROR_STOP=1
          -v app_password="$APP_DB_PASSWORD"
          -f packages/db/setup_roles.sql

      - name: Prove runtime role and tenant isolation
        working-directory: web
        run: psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/test/verify_runtime.sql

      - name: Lint and typecheck
        working-directory: web
        run: pnpm lint

      - name: Test
        working-directory: web
        env:
          RUN_DB_SECURITY_TESTS: '1'
          RUN_DB_INTEGRITY_TESTS: '1'
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Browser workflow smoke
        working-directory: web
        run: pnpm test:browser

      # Breadth to the smoke's depth: the smoke drives 39 routes through real interactions, this loads all 99 and
      # fails if any renders the app's error boundary. The route list comes from the filesystem, so a new page is
      # covered when it is added rather than when someone remembers to list it.
      - name: Route reachability (all pages render)
        working-directory: web
        run: pnpm test:routes

      # ----------------------------------------------------------------------------------------------
      # Parity gates.
      #
      # These existed and passed for weeks without being invoked here, which made them checklist items
      # rather than gates: nothing stopped a change from silently regressing configuration coverage,
      # the desktop-declared schema, or a report layout. Each runs as its OWN step so a failure names
      # itself in the job summary instead of hiding inside a composite command.
      # ----------------------------------------------------------------------------------------------
      - name: 'Gate: configuration coverage (all 128 settings typed and reachable)'
        working-directory: web
        run: pnpm settings:parity

      - name: 'Gate: desktop-declared schema present'
        working-directory: web
        # MIGRATE_DATABASE_URL comes from the workflow-level env, which already carries ?schema=public.
        run: pnpm schema:readiness

      - name: 'Gate: fresh provision produces a tenant-isolated schema'
        working-directory: web
        # Provisions a scratch database from the migration chain and asserts every table carrying tenant_id
        # has RLS enabled AND forced with a policy, then diffs the schema against the working database.
        #
        # This exists because `message_attempt_log` shipped with tenant_id, no RLS and no policy: it was
        # created by a migration that ran after the blanket security pass, so the pass never covered it, and
        # two queries relied on RLS for isolation. Every test passed. It was invisible on a long-lived
        # database that had acquired RLS through unrelated history, and was found only by provisioning a
        # fresh one and diffing. Any future late-added table escapes the same way; this catches it.
        run: pnpm fresh:provision

      - name: 'Gate: report layouts unchanged'
        working-directory: web
        # Never pass --write here: that would rewrite the baselines and make the gate self-approving.
        run: node scripts/report-baselines.mjs

      - name: 'Gate: desktop comparison (expected RED until a real capture exists)'
        working-directory: web
        # This gate is red by design until someone runs the Windows procedure. It is reported rather than
        # enforced so the main job stays actionable, but the status is always visible.
        continue-on-error: true
        run: pnpm g5:parity

      # Unlike g5:parity this one is ENFORCED, because it is answerable today. It does not claim parity — it
      # claims no measured parity number got worse. The distinction is why the two are separate gates.
      #
      # It is enforced because the failure it guards against already happened: the comparison went unrun for a
      # month, 1,354 of 3,787 field differences were fixed without anyone knowing, and a regression in the same
      # window would have been just as invisible.
      - name: 'Gate: parity numbers did not worsen'
        working-directory: web
        run: pnpm parity:measure --reuse

      # Measures the dimension the two gates above cannot see: whether an operator can REACH
      # the desktop's fields. Column-write coverage read 98.9% and settings exposure read
      # complete while operator depth was 33.9%, so neither could detect a shallow screen.
      # Floors may only rise and ceilings may only fall; the baseline lives in
      # web/parity/depth-parity-baseline.json and a loosened floor shows up as a baseline diff.
      - name: 'Gate: operator-reachable field depth did not worsen'
        working-directory: web
        run: pnpm depth:parity

      # A grid column the writer never reads silently discards operator input, and the depth gate above
      # counts it as parity. 29 such columns shipped on purchase-return and 9 on sales before this ran.
      - name: 'Gate: no grid column discards operator input'
        working-directory: web
        run: pnpm depth:deadcells

      - name: Smoke production readiness
        working-directory: web
        env:
          NODE_ENV: production
          PORT: '4000'
        run: |
          node apps/api/dist/server.js >/tmp/datacare-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/datacare-api.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/ready >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 1
          done
          echo 'API readiness timed out' >&2
          exit 1

      - name: Check formatting
        working-directory: web
        run: pnpm format:check

  g5-desktop-comparison:
    name: G5 desktop comparison harness
    # Desktop credentials must never reach candidate-controlled pull-request code. Main is the only push ref
    # admitted by this workflow; its branch protection is the trust boundary for the extraction scripts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datacare
          POSTGRES_PASSWORD: datacare
          POSTGRES_DB: datacare_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U datacare -d datacare_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install exact dependency graph
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Validate and generate database client
        working-directory: web
        run: |
          pnpm --filter @datacare/db db:validate
          pnpm --filter @datacare/db db:generate

      - name: Deploy migration-owned schema and RLS
        working-directory: web
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
        run: |
          pnpm --filter @datacare/db exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --filter @datacare/db exec prisma migrate diff \
            --from-url "$MIGRATE_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          psql "$MIGRATE_DATABASE_DSN" -v ON_ERROR_STOP=1 -f packages/db/prisma/rls.sql

      - name: Bootstrap restricted runtime role
        working-directory: web
        run: >-
          psql "$MIGRATE_DATABASE_DSN"
          -v ON_ERROR_STOP=1
          -v app_password="$APP_DB_PASSWORD"
          -f packages/db/setup_roles.sql

      - name: Build G5 harness dependencies
        working-directory: web
        run: pnpm --filter '@datacare/api...' build

      # ------------------------------------------------------------------------------------------------
      # Desktop comparison.
      #
      # This job previously ran `g5-compare.mjs`, which had six defects that each made the comparison
      # unable to fail — every date canonicalised to the empty string (so 64 date columns across 42
      # tables always matched), 3-decimal rounding, NULL equal to blank, numeric agreement judged by
      # column sums, text upper-cased, and the table set taken as the INTERSECTION of both schemas so a
      # write the web never performed was silently discarded. A green result from it meant nothing, and
      # that file has been deleted.
      #
      # The replacement separates extraction from comparison: each side writes a self-describing bundle,
      # and the differ runs on two files. That is why the differ can be unit tested (24 tests) without a
      # SQL Server, and why a capture is retained as re-examinable evidence.
      # ------------------------------------------------------------------------------------------------
      - name: Detect desktop credentials
        id: desktop
        env:
          DESKTOP_SOURCE_DATABASE: ${{ secrets.DESKTOP_SOURCE_DATABASE }}
        run: |
          if [ -n "$DESKTOP_SOURCE_DATABASE" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Desktop comparison skipped::No DESKTOP_SOURCE_DATABASE secret is configured, so no SQL Server is reachable from CI. This is a SKIP, not a pass: g5:parity stays red until a capture exists. Run web/docs/PARITY-WINDOWS-PROCEDURE.md on the machine with the desktop install.'
          fi

      - name: Extract the desktop bundle
        if: steps.desktop.outputs.available == 'true'
        working-directory: web
        env:
          PARITY_MSSQL_HOST: ${{ secrets.DESKTOP_SOURCE_HOST }}
          PARITY_MSSQL_PORT: ${{ secrets.DESKTOP_SOURCE_PORT }}
          PARITY_MSSQL_USER: ${{ secrets.DESKTOP_SOURCE_USER }}
          PARITY_MSSQL_PASSWORD: ${{ secrets.DESKTOP_SOURCE_PASSWORD }}
          PARITY_MSSQL_DATABASE: ${{ secrets.DESKTOP_SOURCE_DATABASE }}
          PARITY_MSSQL_ENCRYPT: ${{ vars.DESKTOP_SOURCE_ENCRYPT }}
          PARITY_COMPANY: ${{ vars.DESKTOP_G5_COMPANY }}
          PARITY_CASES: ${{ secrets.DESKTOP_PARITY_CASES }}
        # mssql is pinned in package.json/pnpm-lock.yaml and was installed with --frozen-lockfile above.
        # Mutating the dependency graph here would mean CI compared a different tree from the candidate.
        run: node apps/api/integration/parity-extract-mssql.mjs

      - name: Extract the web bundle
        if: steps.desktop.outputs.available == 'true'
        working-directory: web
        env:
          PARITY_TENANT: ci-default
          PARITY_COMPANY: ${{ vars.DESKTOP_G5_COMPANY }}
          PARITY_CASES: ${{ secrets.WEB_PARITY_CASES }}
        run: node apps/api/integration/parity-extract-pg.mjs

      - name: Compare the two bundles
        id: g5_comparison
        if: steps.desktop.outputs.available == 'true'
        working-directory: web
        run: |
          set +e
          node apps/api/integration/parity-compare.mjs \
            ../project-memory/parity/bundles/desktop-latest.json \
            ../project-memory/parity/bundles/web-latest.json
          status=$?
          set -e
          if [ -f ../project-memory/parity/g5/parity-diff-latest.json ]; then
            echo 'produced=true' >> "$GITHUB_OUTPUT"
          else
            echo 'produced=false' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: 'Gate: desktop comparison certifies parity'
        if: steps.desktop.outputs.available == 'true'
        working-directory: web
        # Requires a real Microsoft SQL Server banner in the artifact's provenance, so a hand-made or
        # synthetic bundle cannot be promoted to evidence by renaming a file.
        run: pnpm g5:parity

      - name: Upload G5 comparison artifacts
        # A RED comparison is still useful evidence, but an extraction/compare crash must not publish the
        # checkout's placeholder directory as though this run produced it.
        if: always() && steps.g5_comparison.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g5-desktop-comparison-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: project-memory/parity/g5
          if-no-files-found: error
